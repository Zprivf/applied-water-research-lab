<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | Applied Water Research Lab</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Ensure website always fits screen */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    *,
    *:before,
    *:after {
      box-sizing: inherit;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    .home-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .home-main {
      flex: 2 1 600px;
    }

    .home-sidebar {
      flex: 1 1 300px;
    }

    /* Inline Search Styling */
    .search-section-inline {
      width: 100%;
      background: #f4f7fa;
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      margin: 2rem 0;
    }
  </style>
</head>

<body data-page="home">

  <div id="site-header"></div>

  <main class="page-content">
    <div class="home-grid">
      <div class="home-main" id="homeMain"></div>
      <aside class="home-sidebar" id="homeSidebar"></aside>
    </div>

    <section id="inlineSearch" class="search-section-inline"></section>

    <section class="feature-tiles" id="featureTiles" aria-label="Quick links"></section>

    <section class="news-section">
      <h2>Recent News</h2>
      <div id="recentNews"></div>
    </section>
  </main>

  <button id="backToTop" class="back-to-top" title="Go to top">↑</button>

  <div id="site-footer"></div>

  <script src="content.js"></script>
  <script src="layout.js"></script>
  <script src="main.js"></script>
</body>

</html>
