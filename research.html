<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Research | Applied Water Research Lab</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body data-page="research">

  <div id="site-header"></div>

  <main class="page-content">
    <h1 class="page-title">Research Projects</h1>
    
    <section id="current-projects" class="research-section">
      <h2 class="section-title">Current Projects</h2>
      <div id="currentProjectsList" class="projects-grid"></div>
    </section>

    <section id="previous-projects" class="research-section" style="margin-top: 3rem;">
      <h2 class="section-title">Previous Projects</h2>
      <div id="previousProjectsList" class="projects-grid"></div>
    </section>

    <section id="research-areas" class="research-section" style="margin-top: 3rem;">
      <h2 class="section-title">General Focus Areas</h2>
      <div id="researchList"></div>
    </section>

    <h2 class="page-title" id="gallery" style="margin-top:3rem;font-size:1.35rem">Research Gallery</h2>
    <div id="galleryGrid"></div>
  </main>

  <div id="site-footer"></div>

  <script src="content.js"></script>
  <script src="layout.js"></script>
  <script src="main.js"></script>
</body>
</html>
